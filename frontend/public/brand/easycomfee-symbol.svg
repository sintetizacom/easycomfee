<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127 146" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Símbolo da EasyComfee</title>
  <desc id="descricao">Portal abstrato que representa uma entrada simples para criação com inteligência artificial.</desc>

  <defs>
    <linearGradient id="branco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7" />
      <stop offset="1" stop-color="#EDE9E2" />
    </linearGradient>
    <linearGradient id="lima" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F6FF48" />
      <stop offset="1" stop-color="#E8F72D" />
    </linearGradient>
    <linearGradient id="lilas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7A1B5" />
      <stop offset="1" stop-color="#817A91" />
    </linearGradient>
  </defs>

  <!-- Traçado proporcional ao conceito A aprovado (127 × 146). -->
  <path
    fill="url(#branco)"
    d="M0 146V63C0 28.2 28.4 0 63.5 0S127 28.2 127 63v83h-23V70c0-22.6-18.4-41-41-41S23 47.4 23 70v76H0Z"
  />

  <!-- Faces internas inclinadas que dão profundidade ao portal original. -->
  <path
    fill="url(#lima)"
    d="M23 146V70c0-22.6 18-41 40-41s41 18.4 41 41v76l-41-13-40 13Z"
  />
  <path
    fill="url(#lilas)"
    d="M23 146V70c0-13.6 7-23.2 17-27 14 3 24 15 24 28v62l-41 13Z"
  />
</svg>
