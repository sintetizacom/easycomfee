<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EasyComfee brand preview</title>
<style>

  .claro { background: #F4F0E8; padding: 16px; border-radius: 12px; }
  .escuro { background: #1E1724; padding: 16px; border-radius: 12px; border: 1px solid #382D42; }
  small { color: #888095; }
</style></head><body>
  <div class="linha"><img src="easycomfee-logo-horizontal.svg"><img src="easycomfee-logo-vertical.svg"></div>
  <div class="linha">
    <span class="escuro"><img src="easycomfee-symbol.svg" width="24"> <img src="easycomfee-symbol.svg" width="32"> <img src="easycomfee-symbol.svg" width="48"> <img src="easycomfee-symbol.svg" width="96"></span>
    <small>symbol at 24, 32, 48 and 96 px</small>
  </div>
  <div class="linha">
    <span class="claro"><img src="favicon.svg" width="16"> <img src="favicon.svg" width="32"></span>
    <span class="escuro"><img src="favicon.svg" width="16"> <img src="favicon.svg" width="32"></span>
    <small>favicon on light and dark</small>
  </div>
  <div class="linha"><span class="escuro"><img src="easycomfee-logo-mono-light.svg"></span><span class="claro"><img src="easycomfee-logo-mono-dark.svg"></span></div>
</body></html>
